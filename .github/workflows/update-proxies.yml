name: Update HTTPS Proxies

on:
  schedule:
    - cron: '30 2 * * *'   # 每天凌晨 2:30 执行一次
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 关键：必须添加这行

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}     # 使用你的 PAT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add https_proxies.json https_proxies.txt
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update HTTPS proxies - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:main
          fi
